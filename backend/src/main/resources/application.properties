spring.application.name=chubb-claims-management
server.port=8080

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:chubb_claims_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration (256-bit secret)
app.jwt.secret=ChubbAPACClaimsManagementSecretKeyForJWTSigningMustBe256BitsLong!
app.jwt.expiration-ms=86400000
